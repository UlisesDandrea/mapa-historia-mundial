<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia Mundial - Mapa Interactivo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="map"></div>

    <div id="timeline-container">
        <div class="timeline-header">
            <!-- Corregido: Sin el d.C. estático -->
            <h2>Año: <span id="year-display">1769</span></h2>
        </div>
        <input type="range" id="year-slider" min="-3000" max="2024" value="1769" step="1">
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="datos/fronteras.js"></script>
    <script src="script.js"></script>
</body>
</html>
